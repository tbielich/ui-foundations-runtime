name: CI

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    runs-on: ubuntu-latest
    # Match package-lock.json; browsers/system libraries are already installed.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --init --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the accepted accessibility baseline
          # 8c2c2ebd1a2f43270c34f87171a8200fbd38a410 is present for evidence
          # provenance. A shallow clone omits it and fails identity() closed.
          fetch-depth: 0

      # The container user differs from the checkout owner. Checkout's temporary
      # HOME does not carry trust into later Eleventy/provenance Git commands.
      - name: Trust this container checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Playwright image version
        run: node -e "require('node:assert/strict').equal(require('@playwright/test/package.json').version, '1.63.0', 'Update the pinned CI image with Playwright')"

      - name: Run CI checks
        run: npm run ci:check

      - name: Preserve accessibility evidence and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-${{ github.sha }}-node-${{ matrix.node-version }}
          path: |
            artifacts/accessibility/
            test-results/
            _site/patterns/button/index.html
            _site/patterns/checkbox/index.html
            _site/evidence/accessibility/
