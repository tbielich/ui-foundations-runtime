name: CI

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run CI checks
        run: npm run ci:check

      - name: Preserve accessibility evidence and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-${{ github.sha }}-node-${{ matrix.node-version }}
          path: |
            artifacts/accessibility/
            test-results/
            _site/patterns/button/index.html
            _site/patterns/checkbox/index.html
            _site/evidence/accessibility/
