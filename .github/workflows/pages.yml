name: Deploy PR preview to GitHub Pages

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "site/**"
      - "tests/browser/accessibility/**"
      - "scripts/accessibility-evidence.mjs"
      - "docs/validation/accessibility-criteria.json"
      - "playwright.config.js"
      - "src/**"
      - "dist/**"
      - "config/site.js"
      - ".eleventy.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-prerelease
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install bounded Chromium
        run: npx playwright install --with-deps chromium
      - name: Build, test and render matching evidence
        run: npm run test:a11y
        env:
          SITE_URL: https://tbielich.github.io
          SITE_BASE_PATH: /ui-foundations-runtime
      - name: Preserve accessibility evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-accessibility-${{ github.sha }}
          path: |
            artifacts/accessibility/
            test-results/
            _site/patterns/button/index.html
            _site/patterns/checkbox/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy pre-release
        id: deployment
        uses: actions/deploy-pages@v4
